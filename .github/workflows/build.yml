name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  ONDK_VERSION: "r30.1"
  OPD2515_NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Test extractor
        working-directory: tools/extract_rs
        run: |
          cargo test --release --features http
          cargo build --release --features http

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache ONDK
        id: ondk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ondk
          key: ondk-${{ env.ONDK_VERSION }}-linux

      - name: Download ONDK
        if: steps.ondk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/${ONDK_VERSION}/ondk-${ONDK_VERSION}-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Cache OPD2515 NDK r27
        id: opd2515-ndk-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/opd2515-ndk
          key: opd2515-ndk-${{ env.OPD2515_NDK_VERSION }}-linux

      - name: Download OPD2515 NDK r27
        if: steps.opd2515-ndk-cache.outputs.cache-hit != 'true'
        run: |
          url="https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          mkdir -p "${{ runner.temp }}/opd2515-ndk"
          curl -fL "$url" -o "${{ runner.temp }}/opd2515-ndk.zip"
          unzip -q "${{ runner.temp }}/opd2515-ndk.zip" -d "${{ runner.temp }}/opd2515-ndk"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      - name: Build Ghostlock binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src native-host-tests
          make -C src ghostlock
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true

      - name: Test profile and app wiring
        run: ./gradlew :profile-core:test :app:testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          export OPD2515_NDK_ROOT="${{ runner.temp }}/opd2515-ndk/android-ndk-r27"
          export KEYSTORE_PATH="../keystore.jks"
          export KEYSTORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          export KEY_ALIAS="${{ secrets.ALIAS }}"
          export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          app_id=com.ghostlock.opd2515.legacy
          experimental_property=""
          if [[ "$GITHUB_REF_NAME" == "opd2515-direct-app-experimental" ]]; then
            app_id=com.ghostlock.opd2515.experimental
            experimental_property="-Popd2515DirectExperimental=true"
          fi
          ./gradlew :app:assembleRelease \
            -PforkApplicationId="$app_id" \
            $experimental_property \
            --no-daemon

      - name: Verify OPD2515 packaged preloader
        run: |
          python3 - <<'PY'
          import glob, hashlib, zipfile

          apk = glob.glob('build/app/outputs/apk/release/*.apk')
          if len(apk) != 1:
              raise SystemExit(f'expected one release APK, found {apk!r}')
          with zipfile.ZipFile(apk[0]) as archive:
              data = archive.read('lib/arm64-v8a/libopd2515_preload.so')
              x9u = archive.read('lib/arm64-v8a/libopd2515_x9u_preload.so')
              rebuilt = archive.read('lib/arm64-v8a/libopd2515_x9u_rebuilt_preload.so')
          digest = hashlib.sha256(data).hexdigest().upper()
          x9u_digest = hashlib.sha256(x9u).hexdigest().upper()
          rebuilt_digest = hashlib.sha256(rebuilt).hexdigest().upper()
          known = {
              '01C7FE7FEAF5DB79AA239CF76CA7C0DDB909BE9747FCCFAF794A9420D7A4441C': 91424,
              'CCB15ABD51BB1B1122FF8E916CBE9DB89D3DC6BB162E8111335ED7B02B8FD4EE': 91720,
          }
          if known.get(digest) != len(data):
              raise SystemExit(
                  f'unknown OPD2515 preloader size/hash: {len(data)} {digest}'
              )
          if x9u_digest != '32AC2F03F56955C41032157AA53F23590C3F6A1595FCCC025AD991322E07F7F6' \
                  or len(x9u) != 89136:
              raise SystemExit(
                  f'unknown validated X9U preloader size/hash: {len(x9u)} {x9u_digest}'
              )
          if rebuilt_digest != 'A4EBA1AE0AB3A9F420DC9B75181F70B49FF725192CF0933F15E36A0861511519' \
                  or len(rebuilt) != 89832:
              raise SystemExit(
                  f'unknown OPD2515 rebuilt preloader size/hash: {len(rebuilt)} {rebuilt_digest}'
              )
          print(f'OPD2515 packaged preloader size={len(data)} sha256={digest}')
          print(f'validated X9U App-UID preloader size={len(x9u)} sha256={x9u_digest}')
          print(f'OPD2515 rebuilt App-UID preloader size={len(rebuilt)} sha256={rebuilt_digest}')
          PY

      - name: Strip Ghostlock binary
        run: |
          "${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all build/native/ghostlock || true

      - name: Rename Release APK
        run: mv build/app/outputs/apk/release/*.apk GhostLock-release.apk

      - name: Prepare extractor binaries
        run: |
          cp build/extract/release/ghostlock-extract tools/extract_rs/ghostlock-extract-linux-x86_64

          export CC_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="${{ runner.temp }}/ondk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C force-unwind-tables=no -C link-arg=-Wl,--icf=all"
          cargo +ondk build --release --target aarch64-linux-android --features http --manifest-path tools/extract_rs/Cargo.toml --target-dir build/extract \
            -Z build-std=std,panic_abort -Z build-std-features=optimize_for_size
          cp build/extract/aarch64-linux-android/release/ghostlock-extract tools/extract_rs/ghostlock-extract-android-arm64

      - name: Export kernel profiles (GLK1)
        run: ./gradlew exportKernelProfiles --no-daemon

      - name: Package kernel profiles
        run: |
          cd build/kernel-profiles
          zip -r "$GITHUB_WORKSPACE/GhostLock-kernel-profiles.zip" .
          unzip -l "$GITHUB_WORKSPACE/GhostLock-kernel-profiles.zip" | tail -5

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-release
          path: GhostLock-release.apk
          archive: false

      # Keep an installable APK as a single file as well.  The flattened
      # artifact above is useful to the existing release pipeline, while the
      # experimental App-UID branch must be downloadable with its APK
      # container intact for a real-device gate.
      - name: Upload Installable APK
        if: ${{ github.ref == 'refs/heads/opd2515-direct-app-experimental' }}
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-installable-apk
          path: GhostLock-release.apk
          archive: true

      - name: Upload kernel profiles
        uses: actions/upload-artifact@v7
        with:
          name: GhostLock-kernel-profiles
          path: GhostLock-kernel-profiles.zip
          archive: false

      - name: Upload Ghostlock binary
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock
          path: build/native/ghostlock
          archive: false

      - name: Upload Extractor Linux
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-linux-x86_64
          path: tools/extract_rs/ghostlock-extract-linux-x86_64
          archive: false

      - name: Upload Extractor Android
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-android-arm64
          path: tools/extract_rs/ghostlock-extract-android-arm64
          archive: false

  build-extractor-macos:
    name: Build Extractor (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build macOS universal binary
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http --target aarch64-apple-darwin
          cargo build --release --features http --target x86_64-apple-darwin
          mkdir -p bin
          lipo -create -output bin/ghostlock-extract-macos-universal \
            ../../build/extract/aarch64-apple-darwin/release/ghostlock-extract \
            ../../build/extract/x86_64-apple-darwin/release/ghostlock-extract

      - name: Upload Extractor macOS
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-macos-universal
          path: tools/extract_rs/bin/ghostlock-extract-macos-universal
          archive: false

  build-extractor-windows:
    name: Build Extractor (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/extract
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/extract_rs/Cargo.lock') }}

      - name: Build Windows binary
        shell: bash
        working-directory: tools/extract_rs
        run: |
          cargo build --release --features http
          mkdir -p bin
          cp ../../build/extract/release/ghostlock-extract.exe bin/ghostlock-extract-windows-x86_64.exe

      - name: Upload Extractor Windows
        uses: actions/upload-artifact@v7
        with:
          name: ghostlock-extract-windows-x86_64
          path: tools/extract_rs/bin/ghostlock-extract-windows-x86_64.exe
          archive: false

  prerelease:
    name: Pre-release
    needs: [build-apk, build-extractor-macos, build-extractor-windows]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Prepare release files and notes
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          chmod +x release-files/ghostlock release-files/ghostlock-extract-* || true

          cd release-files
          for f in GhostLock-release.apk ghostlock ghostlock-extract-* GhostLock-kernel-profiles.zip; do
            if [ -f "$f" ]; then
              sha256sum "$f"
            fi
          done > sha256sum.txt
          cd ..

          VERSION_NAME=$(sed -nE 's/^[[:space:]]*val appVersionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          SHORT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B)

          export VERSION_NAME
          export SHORT_HASH
          export COMMIT_COUNT
          export COMMIT_MSG

          python3 - <<'PY'
          import os

          version = os.environ.get("VERSION_NAME", "Unknown")
          short_hash = os.environ.get("SHORT_HASH", "Unknown")
          commit_count = os.environ.get("COMMIT_COUNT", "0")
          commit_msg = os.environ.get("COMMIT_MSG", "No commit message").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "YuKongA/ghostlock-app")
          sha = os.environ.get("GITHUB_SHA", "")

          with open("release-files/sha256sum.txt", "r", encoding="utf-8") as f:
              checksums = f.read().strip()

          lines = [
              "### GhostLock Pre-release",
              "",
              f"- **Version**: `v{version}` (`{commit_count}`)",
              f"- **Commit**: [`{short_hash}`](https://github.com/{repo}/commit/{sha})",
              "",
              "#### Commit Message",
              "```",
              commit_msg,
              "```",
              "",
              "#### Files",
              "- `GhostLock-release.apk`: GhostLock Android Application",
              "- `ghostlock`: Standalone GhostLock native binary (Android arm64-v8a)",
              "- `GhostLock-kernel-profiles.zip`: Bundled kernel profiles (HOCON)",
              "- `ghostlock-extract-android-arm64`: Kernel offset extractor CLI (Android arm64-v8a)",
              "- `ghostlock-extract-linux-x86_64`: Kernel offset extractor CLI (Linux x86_64)",
              "- `ghostlock-extract-macos-universal`: Kernel offset extractor CLI (macOS Universal arm64 + x86_64)",
              "- `ghostlock-extract-windows-x86_64.exe`: Kernel offset extractor CLI (Windows x86_64)",
              "",
              "#### SHA256 Checksums",
              "```",
              checksums,
              "```",
          ]
          notes = "\n".join(lines) + "\n"

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PY

      - name: Update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f pre-release
          git push -f origin pre-release
          gh release edit pre-release --target ${{ github.sha }} 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release
          target_commitish: ${{ github.sha }}
          name: GhostLock Pre-release
          body_path: release-notes.md
          prerelease: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post_telegram:
    needs: [build-apk, build-extractor-macos, build-extractor-windows]
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Post to Telegram
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_LINK: ${{ secrets.BOT_API_LINK }}
        run: bash .github/scripts/post_telegram.sh
